name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercy-bench
  cancel-in-progress: true

jobs:
  benchmark:
    # Intentionally does not fall back to GitHub-hosted hardware. Performance
    # numbers are only meaningful on the canonical target machine.
    runs-on: [self-hosted, linux, x64, mercy-bench]
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain info
        run: |
          rustc --version --verbose
          cargo --version
          uname -a
          lscpu

      - name: Partition benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench --bench partition 2>&1 | tee benchmark-partition.txt

      - name: Upload partition benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercy-partition-benchmark-results
          path: benchmark-partition.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Reference codec benchmarks
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          cargo bench --bench reference_codec 2>&1 | tee benchmark-reference-codec.txt

      - name: Upload reference codec benchmark results
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mercy-reference-codec-benchmark-results
          path: benchmark-reference-codec.txt
          if-no-files-found: warn
          retention-days: 30
