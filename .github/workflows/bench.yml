name: Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercy-bench
  cancel-in-progress: true

jobs:
  benchmark:
    # Performance numbers only run on the canonical benchmark host.
    runs-on: [self-hosted, linux, x64, mercy-bench]
    env:
      RUSTFLAGS: -C target-cpu=native
      CARGO_TERM_COLOR: never

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain info
        run: |
          rustc --version --verbose
          cargo --version
          uname -a
          lscpu

      - name: Tail probability benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench --bench tail_probability 2>&1 | tee benchmark-tail-probability.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mercy-tail-probability-benchmark-results
          path: benchmark-tail-probability.txt
          if-no-files-found: warn
          retention-days: 30
