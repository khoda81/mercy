name: Capture Serde clippy

on:
  push:
    branches: [agent/serde-prediction-model]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/serde-prediction-model

      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy

      - name: Capture clippy output
        run: |
          cargo clippy --all-targets --all-features -- -D warnings > ci-clippy.log 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-clippy.log
          git commit -m "capture serde clippy output"
          git push
