name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Compile benchmarks
        run: cargo bench --all-features --no-run

      - name: Format critdash
        run: cargo fmt --manifest-path tools/critdash/Cargo.toml -- --check

      - name: Check critdash
        run: cargo check --manifest-path tools/critdash/Cargo.toml --all-targets

      - name: Clippy critdash
        run: cargo clippy --manifest-path tools/critdash/Cargo.toml --all-targets -- -D warnings

      - name: Test critdash
        run: cargo test --manifest-path tools/critdash/Cargo.toml --all-targets
