          text = text[:start] + replacement + text[end:]

          path.write_text(text)

          Path('src/lib.rs').write_text('''//! `mercy`: type-safe probabilistic serialization and compression.\n//!\n//! Serde supplies the shared structural program. A stateful model predicts the\n//! next canonical byte distribution, and the same model drives both entropy\n//! encoding and entropy decoding.\n\npub mod serde_model;\n\npub use serde_model::{\n    decode, encode, ByteCategorical, ChoiceDecoder, ChoiceEncoder, IntoByteCategorical, Model,\n};\n''')

          Path('Cargo.toml').write_text('''[package]\nname = "mercy"\nversion = "0.1.0"\nedition = "2021"\ndescription = "Type-safe probabilistic serialization and compression"\nlicense = "MIT OR Apache-2.0"\n\n[lib]\npath = "src/lib.rs"\n\n[dependencies]\nserde = { version = "1", features = ["derive"] }\n''')

