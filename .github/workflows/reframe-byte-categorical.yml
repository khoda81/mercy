name: Reframe byte categorical

on:
  push:
    branches: [agent/serde-prediction-model]

permissions:
  contents: write

jobs:
  reframe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/serde-prediction-model

      - name: Install Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Reframe and validate
        run: |
          python .github/reframe_byte_categorical.py
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          rm .github/reframe_byte_categorical.py
          rm .github/workflows/reframe-byte-categorical.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "reframe predictions around byte categorical"
          git push
