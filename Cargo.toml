[package]
name = "mercy"
version = "0.1.0"
edition = "2021"
description = "Type-safe probabilistic serialization and compression"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "output_bytes_bench"
harness = false

[[bench]]
name = "coder_round_trip_bench"
harness = false
