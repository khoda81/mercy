[package]
name = "cargo-critdash"
version = "0.1.0"
edition = "2021"
description = "Live empirical comparison dashboard for Criterion.rs benchmarks"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-critdash"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
